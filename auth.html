<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaid Setup Utility</title>
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f9f9f9;}
        .container { max-width: 600px; margin: auto; padding: 30px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; transition: background 0.2s;}
        button:hover:not(:disabled) { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .token-box { background: #f4f4f4; padding: 15px; margin-top: 20px; font-family: monospace; word-break: break-all; border: 1px solid #ddd; border-radius: 4px; color: #28a745; font-size: 1.1em;}
        p { color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Plaid Setup Utility</h2>
        <p>Use this page to authenticate with your bank and generate an Access Token.</p>
        <button id="link-btn" disabled>Loading Plaid...</button>
        <div id="result" style="display: none;">
            <h3 style="color: #28a745;">Authentication Successful!</h3>
            <p>Please copy the Access Token below and add it to your <code>.env</code> file as <code>PLAID_ACCESS_TOKEN</code>.</p>
            <div class="token-box" id="access-token"></div>
            <p style="font-size: 0.9em;">Once saved, you can close this window and run your analysis scripts.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const btn = document.getElementById('link-btn');
            
            try {
                // Fetch link_token from our FastAPI backend
                const response = await fetch('/plaid/create_link_token', { method: 'POST' });
                const data = await response.json();
                
                const handler = Plaid.create({
                    token: data.link_token,
                    onSuccess: async (public_token, metadata) => {
                        btn.innerText = 'Exchanging token...';
                        btn.disabled = true;
                        try {
                            // Exchange public_token for access_token
                            const res = await fetch('/plaid/set_access_token', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ public_token })
                            });
                            const exchangeData = await res.json();
                            
                            document.getElementById('access-token').innerText = exchangeData.access_token;
                            document.getElementById('result').style.display = 'block';
                            btn.style.display = 'none';
                        } catch (exchangeErr) {
                            console.error('Error exchanging token:', exchangeErr);
                            alert('Failed to exchange token. See console for details.');
                            btn.innerText = 'Connect a Bank Account';
                            btn.disabled = false;
                        }
                    },
                    onExit: (err, metadata) => {
                        if (err) {
                            console.error('Link Exited with Error:', err);
                            alert(`Link Error: ${err.display_message || err.error_message}`);
                        }
                    }
                });

                btn.removeAttribute('disabled');
                btn.innerText = 'Connect a Bank Account';
                btn.onclick = () => handler.open();
                
            } catch (err) {
                console.error('Error initializing Plaid Link', err);
                btn.innerText = 'Error loading Plaid';
            }
        });
    </script>
</body>
</html>
