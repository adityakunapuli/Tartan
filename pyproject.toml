[project]
name = "plaid-local"
version = "0.1.0"
description = "App to setup a plaid-based ETL pipeline q+ analysis."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "pandas>=2.3.3",
    "pandas-stubs==2.3.3.251219",
    "plaid-python>=38.0.0",
    "plotly>=6.5.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "ruff>=0.14.11",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.11",
]

[tool.ruff.lint]
select = ["D"]
# D203: 1 blank line required before class docstring (conflicts with D211: No blank lines allowed before class docstring)
# D213: Multi-line docstring summary should start at the second line (conflicts with D212: Multi-line docstring summary should start at the first line)
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
