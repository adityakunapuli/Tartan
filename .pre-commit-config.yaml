repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        types: [python]
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        types: [javascript, jsx, ts, tsx]
        pass_filenames: false